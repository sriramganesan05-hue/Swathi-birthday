name: Render Birthday Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install moviepy==1.0.3 Pillow==9.5.0 numpy

      - name: Render Video
        run: python make_edit.py

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: Swathi-Birthday-Edit
          path: birthday_edit.mp4
