<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Swathi! ✨</title>
  
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0d0c1d;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Blur background layer */
    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.4);
      transform: scale(1.1);
      transition: background-image 1s ease-in-out;
      z-index: 1;
    }

    /* Main Phone-style Container */
    .viewer {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      height: 92vh;
      max-height: 840px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      background: #111;
      display: flex;
      flex-direction: column;
    }

    /* Slides */
    .slide-frame {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    .slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.8s ease-in-out, transform 4s ease-out;
    }

    .slide-img.active {
      opacity: 1;
      transform: scale(1.08); /* Subtle Ken-Burns zoom */
    }

    /* Greeting Banner */
    .overlay-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 20px 25px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85) 40%, rgba(0, 0, 0, 0.95));
      text-align: center;
      z-index: 5;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 500;
      color: #ffd700;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }

    /* Progress bar */
    .progress-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .bar-segment {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #ffd700;
      transition: width 0.1s linear;
    }

    /* Start / Reveal Screen */
    .gift-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #2a1b40 0%, #0c0814 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .gift-box {
      font-size: 90px;
      animation: bounce 1.4s infinite alternate ease-in-out;
      margin-bottom: 20px;
    }

    .tap-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    @keyframes bounce {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(-18px) scale(1.08); }
    }
  </style>
</head>
<body>

  <!-- Background Blur -->
  <div class="bg-blur" id="bgBlur"></div>

  <!-- Opening Reveal Screen -->
  <div class="gift-modal" id="giftModal" onclick="startSurprise()">
    <div class="gift-box">🎁</div>
    <div class="tap-text">Tap to Open Your Birthday Surprise ✨</div>
  </div>

  <!-- Mobile Reel Frame -->
  <div class="viewer">
    <!-- Instagram-style top progress bar -->
    <div class="progress-bar" id="progressBar"></div>

    <div class="slide-frame" id="slideFrame">
      <!-- Photos injected by JS -->
    </div>

    <div class="overlay-content">
      <h1 class="title">Happy Birthday Swathi! 🌸</h1>
      <p class="subtitle">"No place I'd rather be ❤️"</p>
    </div>
  </div>

  <!-- Audio Player -->
  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    // YOUR 19 PHOTOS LIST
    const images = [
      "IMG-20260920-WA0007.jpg",
      "IMG-20260920-WA0002.jpg",
      "IMG-20260916-WA0016.jpg",
      "IMG-20260916-WA0015.jpg",
      "IMG-20260913-WA0001.jpg",
      "IMG-20260913-WA0000.jpg",
      "IMG-20260911-WA0037.jpg",
      "IMG-20260911-WA0036.jpg",
      "IMG-20260911-WA0034.jpg",
      "IMG-20260911-WA0033.jpg",
      "IMG-20260911-WA0032.jpg",
      "IMG-20260911-WA0027.jpg",
      "IMG-20260911-WA0026.jpg",
      "IMG-20260911-WA0024.jpg",
      "IMG-20260911-WA0023.jpg",
      "IMG-20260911-WA0020.jpg",
      "IMG-20260911-WA0017.jpg",
      "IMG-20260911-WA0012.jpg",
      "IMG-20260902-WA0018.jpg"
    ];

    const slideFrame = document.getElementById("slideFrame");
    const bgBlur = document.getElementById("bgBlur");
    const progressBar = document.getElementById("progressBar");
    const bgMusic = document.getElementById("bgMusic");

    let currentIndex = 0;
    const slideDuration = 2200; // 2.2 seconds per photo (matches tempo)

    // Build the slides & progress dots
    images.forEach((src, idx) => {
      const img = document.createElement("img");
      img.src = src;
      img.className = "slide-img" + (idx === 0 ? " active" : "");
      img.id = "slide-" + idx;
      slideFrame.appendChild(img);

      const segment = document.createElement("div");
      segment.className = "bar-segment";
      segment.innerHTML = '<div class="bar-fill" id="fill-' + idx + '"></div>';
      progressBar.appendChild(segment);
    });

    bgBlur.style.backgroundImage = `url('${images[0]}')`;

    function fireConfetti() {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function showSlide(index) {
      document.querySelectorAll(".slide-img").forEach((el, i) => {
        el.classList.toggle("active", i === index);
      });
      document.querySelectorAll(".bar-fill").forEach((el, i) => {
        el.style.width = i <= index ? "100%" : "0%";
      });
      bgBlur.style.backgroundImage = `url('${images[index]}')`;
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % images.length;
      showSlide(currentIndex);
      if (currentIndex % 3 === 0) fireConfetti();
    }

    function startSurprise() {
      // Hide Modal
      const modal = document.getElementById("giftModal");
      modal.style.opacity = "0";
      setTimeout(() => modal.style.visibility = "hidden", 800);

      // Play "Rather Be"
      bgMusic.currentTime = 64; // Start at the chorus drop!
      bgMusic.play().catch(e => console.log("Audio waiting for user gesture:", e));

      // Fireworks Confetti
      fireConfetti();
      setTimeout(fireConfetti, 400);
      setTimeout(fireConfetti, 800);

      // Slideshow loop
      showSlide(0);
      setInterval(nextSlide, slideDuration);
    }
  </script>
</body>
</html>
